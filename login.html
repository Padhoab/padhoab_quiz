<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | TestKaroAB</title>

<link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Laila',serif;
}

body{
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.login-box{
background:white;
padding:40px;
width:90%;
max-width:450px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0b1533;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#1E3A8A,#7C3AED);
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

p{
margin-top:20px;
text-align:center;
}

a{
color:#1E3A8A;
font-weight:600;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Login to TestKaroAB</h1>

<input
type="email"
id="loginEmail"
placeholder="Email Address">

<div style="position:relative;">

<input
type="password"
id="loginPassword"
placeholder="Password">

<span
id="togglePassword"
style="
position:absolute;
right:15px;
top:15px;
cursor:pointer;
font-size:18px;
">

👁

</span>

</div>

<button id="loginBtn">

Login

</button>

<p>

<a href="#"

id="forgotPassword">

Forgot Password?

</a>

</p>
  
<p>

New User?

<a href="signup.html">

Create Account

</a>

</p>

</div>

<script>

const passwordField =
document.getElementById("loginPassword");

const togglePassword =
document.getElementById("togglePassword");

togglePassword.addEventListener("click",()=>{

if(passwordField.type==="password"){

passwordField.type="text";

togglePassword.innerHTML="🙈";
  
}

else{

passwordField.type="password";

togglePassword.innerHTML="👁";
  
}

});

</script>

<script type="module" src="auth.js"></script>

</body>

</html>
