<!DOCTYPE html>
<html>

<head>

<title>TestkaroAB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{

margin:0;

font-family:'Laila', serif;

background:#eef2f7;

}

.container{

max-width:950px;

margin:30px auto;

background:white;

padding:60px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

h2{

text-align:center;

color:#1e3a8a;

font-size:56px;

font-weight:700;

margin-bottom:15px;

line-height:1.2;

}

.subtitle{

text-align:center;

font-size:22px;

font-weight:500;

color:#6b7280;

margin-top:-5px;

margin-bottom:40px;

}
  
.timer{
color:red;
font-weight:bold;
text-align:right;
}

.option{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#f1f5f9;
cursor:pointer;
}

.selected{
background:#2563eb;
color:white;
}

.subjectBtn{

width:100%;

padding:18px;

margin:10px 0;

background:#2563eb;

color:white;

border:none;

border-radius:15px;

font-size:22px;

font-weight:600;

cursor:pointer;

transition:0.3s;

box-shadow:0 4px 15px rgba(37,99,235,.25);

}

.subjectBtn:hover{

background:#1d4ed8;

transform:translateY(-2px);

box-shadow:0 8px 20px rgba(37,99,235,.35);

}

.nav button{
padding:10px;
margin:5px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.submitBtn{

background:#16a34a !important;

transition:0.15s;

}

.submitBtn:hover{

background:#15803d !important;

}

.submitBtn:active{

transform:scale(0.92);

background:#166534 !important;

}

.nav button{

transition:0.15s;

}

.nav button:active{

transform:scale(0.95);

}

.resultBox{
padding:10px;
background:#f8fafc;
margin-top:10px;
}

.correct{color:green}
.wrong{color:red}
.final{color:purple;font-weight:bold}

header{

background:#07112b;

padding:15px 8%;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:2px solid #1e3a8a;

}

.logo img{

width:120px;

height:auto;

}

nav{

display:flex;

gap:30px;

}

nav a{

color:white;

text-decoration:none;

font-size:18px;

font-weight:600;

}

nav a:hover{

color:#60a5fa;

}

footer{

background:#07112b;

color:white;

text-align:center;

padding:40px 20px;

margin-top:50px;

}

.footer-links{

margin-bottom:20px;

}

.footer-links a{

color:white;

text-decoration:none;

margin:0 15px;

font-size:18px;

font-weight:500;

}

.footer-links a:hover{

color:#60a5fa;

}

/* ===== Performance Summary ===== */

.summaryGrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:16px;
margin:30px 0;
}

.summaryCard{
background:#f8fafc;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.06);
}

.summaryLabel{
font-size:16px;
color:#64748b;
margin-bottom:12px;
font-weight:600;
}

.summaryValue{
font-size:38px;
font-weight:700;
color:#1e3a8a;
}

@media(max-width:768px){

.summaryGrid{

grid-template-columns:repeat(2,1fr);

gap:12px;

}

.summaryCard{

padding:18px 12px;

}

.summaryValue{

font-size:30px;

}

}
  
@media (max-width:768px){

header{
flex-direction:column;
padding:15px;
}

.logo img{
width:80px;
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:15px;
}

nav a{
font-size:16px;
}

.container{

width:auto;

margin:10px;

padding:18px;

box-sizing:border-box;

}
  
.quizTitle{

font-size:34px !important;

word-break:keep-all;
overflow-wrap:break-word;
  
line-height:1.3;

margin-bottom:20px;

}

}
  

#palette{
display:flex!important;
flex-wrap:nowrap!important;
overflow-x:auto;
gap:8px;
padding:8px 4px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
}
#palette::-webkit-scrollbar{display:none;}
#palette button{flex:0 0 auto;width:44px!important;height:44px!important;}

/* ===== Submit Modal ===== */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
backdrop-filter:blur(4px);
}

.modal.show{
display:flex;
}

.modalBox{
background:#fff;
width:90%;
max-width:420px;
padding:24px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
animation:pop .18s ease;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.95);
}
to{
opacity:1;
transform:scale(1);
}
}

.modalBox h2{
margin:0 0 18px;
text-align:center;
color:#1e3a8a;
}

#submitStats p{
margin:8px 0;
font-size:17px;
}

.warning{
margin-top:20px;
color:#d32f2f;
font-weight:bold;
}

.modalButtons{
display:flex;
gap:12px;
margin-top:25px;
}

.cancelBtn,
.submitBtn2{

flex:1;
padding:12px;
font-size:17px;
border:none;
border-radius:10px;
cursor:pointer;

}

.cancelBtn{

background:#e5e7eb;

}

.submitBtn2{

background:#16a34a;
color:white;

}


</style>

</head>

<body>

<header>

<div class="logo">

<a href="https://padhoab.in">

<img src="logo.png">

</a>

</div>

<nav>

<a href="https://padhoab.in">Home</a>

<a href="https://padhoab.in/current-affairs.html">Current Affairs</a>

<a href="https://padhoab.in/static-gk.html">Static GK</a>

<a href="https://padhoab.in/contact.html">Contact</a>

</nav>

</header>

<div id="app" class="container">

Loading...

</div>

<script>

let q=0;
let quiz=[];
let answers=[];
let visited=[];
let review=[];
const PALETTE_SIZE = 10;
let dataAll=[];
let userName="";
let exam="";
let subject="";
let topic="";
let timer;

const examConfig = {

"UPSC":{
timePerQuestion:72,
positive:2,
negative:0.66
},

"UPPCS":{
timePerQuestion:48,
positive:1.33,
negative:0.44
},

"BPSC":{
timePerQuestion:48,
positive:1,
negative:0.33
},

"Bihar APO":{
timePerQuestion:72,
positive:1,
negative:0.25
},

"Current affairs":{
timePerQuestion:60,
positive:1,
negative:0
},
  
"SSC CGL":{
timePerQuestion:36,
positive:2,
negative:0.50
},

"Railway":{
timePerQuestion:36,
positive:1,
negative:0.33
},


"Law":{
timePerQuestion:60,
positive:1,
negative:0
}

};

let questionTime;

let isBiharPattern = false;
  
let timeLeft = 0;
  
const qAPI =
"https://script.google.com/macros/s/AKfycby2Hh9iPQC2mx44e4HBQQ6kemwUBcAi5O7UD1czaWJ0lxV5zUIA5RQr2KhjZql0451pMw/exec";

const rAPI =
"https://script.google.com/macros/s/AKfycby2Hh9iPQC2mx44e4HBQQ6kemwUBcAi5O7UD1czaWJ0lxV5zUIA5RQr2KhjZql0451pMw/exec";
  
function menu(){

return `
<div style="
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
">

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="showExams()">
🏠 All Exams
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="selectExam(exam)">
📚 Subject
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="showProgress()">
📊 My Progress
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px;background:#dc2626"
onclick="logout()">
🚪 Logout
</button>

</div>
`;

}

function breadcrumb(){

return `
<div style="
margin-bottom:20px;
font-size:15px;
color:#64748b;
">

🏠 Home
${exam ? ` › ${exam}` : ""}
${subject ? ` › ${subject}` : ""}
${topic ? ` › ${topic}` : ""}

</div>
`;

}

function start(){

app.innerHTML=`

<h2>Welcome to TestkaroAB</h2>

<p class="subtitle">
Practice Smart • Compete Better • Learn Faster
</p>

<input

id="nameInput"

value="${userName}"

placeholder="Enter Your Name to Start Practicing"

style="
width:100%;
padding:20px;
margin:25px 0;
border:1px solid #d1d5db;
border-radius:15px;
font-size:22px;
outline:none;
box-sizing:border-box;
"
>

<button
class="subjectBtn"
onclick="continueQuiz()">

Start Practicing

</button>

`;

}
async function continueQuiz(){

    userName =
    document.getElementById("nameInput").value;

    if(userName!=""){

        localStorage.setItem(
        "testkaroab_name",
        userName
        );

    }

    if(userName==""){

        alert("Please enter your name");

        return;

    }

    // Wait only if background download is still running
    while(dataAll.length==0){

        await new Promise(r=>setTimeout(r,100));

    }

    showExams();

}

async function preloadQuestions(){

    if(dataAll.length>0) return;

    try{

        console.log("Preloading questions...");

        let res = await fetch(qAPI);

        dataAll = await res.json();

        console.log("Questions Ready:",dataAll.length);

    }
    catch(err){

        console.error(err);

    }

}
  
function showNameBox(){

app.innerHTML=`

<h2>Welcome to TestkaroAB</h2>

<p class="subtitle">

Choose Your Name

</p>

<input

id="nameInput"

placeholder="Enter Your Name"

style="
width:100%;
padding:20px;
margin:25px 0;
border:1px solid #d1d5db;
border-radius:15px;
font-size:22px;
outline:none;
box-sizing:border-box;
">

<button
class="subjectBtn"
onclick="continueQuiz()">

Continue

</button>

`;

}


  
function showExams(){

let html = menu();

html += `
<h2>Welcome, ${userName}</h2>

<p class="subtitle">
Select an Exam to Continue Your Preparation
</p>

`;

let exams=[];

for(let i=0;i<dataAll.length;i++){

let e=dataAll[i].Exam;

if(!exams.includes(e))
exams.push(e);

}

for(let i=0;i<exams.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectExam('"+exams[i]+"')\">"+
exams[i]+
"</button>";

}

app.innerHTML=html;

}


function selectExam(e){

exam=e;

if(dataAll.length==0){

app.innerHTML=
menu()+`
<h2>Loading Questions...</h2>
`;

setTimeout(()=>{
selectExam(e);
},500);

return;

}

let subs=[];

for(let i=0;i<dataAll.length;i++){

if(dataAll[i].Exam==exam){

let s=dataAll[i].Subject;

if(!subs.includes(s))
subs.push(s);

}

}

let html=`
<h2>${exam}</h2>

<p class="subtitle">
Choose a Subject
</p>
`;

for(let i=0;i<subs.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectSubject('"+subs[i]+"')\">"+
subs[i]+
"</button>";

}

app.innerHTML=html;

}


function selectSubject(s){

subject=s;

let topics=[];

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject
){

let t=dataAll[i].Topic;

if(!topics.includes(t))
topics.push(t);

}

}

let html=`
<h2>${subject}</h2>

<p class="subtitle">
Choose a Topic
</p>
`;
  
for(let i=0;i<topics.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectTopic('"+topics[i]+"')\">"+
topics[i]+
"</button>";

}

app.innerHTML=html;

}


function selectTopic(t){

topic=t;

isBiharPattern =
exam=="BPSC" ||
exam=="Bihar APO" ||
(exam=="Current affairs" && subject=="BPSC");
  
quiz=[];
answers=[];
q=0;

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject &&
dataAll[i].Topic==topic
){

quiz.push({

question: formatQuestion(dataAll[i].question),
  
options:[
dataAll[i].op1,
dataAll[i].op2,
dataAll[i].op3,
dataAll[i].op4
],

correct:parseInt(dataAll[i].correct),

explanation:dataAll[i].Explanation

});

answers.push(null);

visited.push(false);

review.push(false);

}

}

console.log(exam);
console.log(examConfig[exam]);
  
questionTime =
examConfig[exam].timePerQuestion;

timeLeft = questionTime * quiz.length;

showQuiz();

startTimer();

}

function startTimer(){

if(timer) return;

timer = setInterval(()=>{

timeLeft--;

let minutes = Math.floor(timeLeft/60);

let seconds = timeLeft%60;

timerBox.innerHTML =
"⏱ "
+String(minutes).padStart(2,"0")
+":"
+String(seconds).padStart(2,"0");
  
if(timeLeft<=0){

    clearInterval(timer);

    timer=null;

    submitTest();

}

},1000);

}
  
function showQuiz(){

localStorage.setItem(
"inTest",
"yes"
);
  
q =
parseInt(
localStorage.getItem(
"currentQuestion"
)
)
||0;

answers =
JSON.parse(
localStorage.getItem(
"answers"
)
)
||answers;

let html="";

let start = Math.max(0, q - 4);
let end = Math.min(quiz.length, start + PALETTE_SIZE);

if(end - start < PALETTE_SIZE){
    start = Math.max(0, end - PALETTE_SIZE);
}

html += `
<div id="paletteNav"
style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:12px;
">

<button onclick="palettePrev()">◀</button>

<div id="palette"
style="
display:flex;
gap:8px;
overflow:hidden;
flex:1;
">
`;

for(let i=start;i<end;i++){

    let color="#e5e7eb";

    if(i===q){

        color="#2563eb";

    }
    else if(review[i]){

        color="#a855f7";

    }
    else if(answers[i]!=null){

        if(isBiharPattern && answers[i]==4){

            color="#9ca3af";

        }else{

            color="#16a34a";

        }

    }
    else if(visited[i]){

        color="#facc15";

    }

    html+=`
<button
onclick="goToQuestion(${i})"
style="
width:44px;
height:44px;
border:none;
border-radius:10px;
background:${color};
font-weight:bold;
cursor:pointer;
flex:0 0 auto;
">
${i+1}
</button>`;
}

html+=`
</div>

<button onclick="paletteNext()">▶</button>

</div>
`;
  
html+="<h2 class='quizTitle'>"+topic+"</h2>";
  
html+=`
<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin:8px 0;
font-size:18px;
">
<div>👤 ${userName}</div>
<div id="timerBox" class="timer"></div>
</div>
`;
  
html+=`
<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin:8px 0 12px;
">

<h3 id="qno" style="margin:0;"></h3>

<div
style="
font-size:14px;
font-weight:700;
color:#666;
white-space:nowrap;
">
[+${examConfig[exam].positive} / -${examConfig[exam].negative}]
</div>

</div>
`;
  
html+="<p id='question' style='font-size:22px;line-height:1.7;'></p>";
  
html+="<button class='option' id='b0' onclick='answer(0)'></button>";
html+="<button class='option' id='b1' onclick='answer(1)'></button>";
html+="<button class='option' id='b2' onclick='answer(2)'></button>";
html+="<button class='option' id='b3' onclick='answer(3)'></button>";

if(isBiharPattern){
  
html+="<button class='option' id='b4' onclick='answer(4)'>Not Attempted</button>";

}

html+="<div class='nav'>";
html+="<button onclick='prev()'>Prev</button>";
html+="<button onclick='next()'>Next</button><button onclick='toggleReview()'>Review</button>";
html+="<button class='submitBtn' onclick='confirmSubmit()'>Submit</button>";
html+="</div>";

html += `
<div id="submitModal" class="modal">

    <div class="modalBox">

        <h2>📝 Submit Test</h2>

        <div id="submitStats"></div>

        <p class="warning">
            ⚠ Once submitted, you cannot change your answers.
        </p>

        <div class="modalButtons">

            <button class="cancelBtn"
            onclick="closeSubmitModal()">
                Continue Test
            </button>

            <button class="submitBtn2"
            onclick="finalSubmit()">
                Submit Test
            </button>

        </div>

    </div>

</div>
`;

app.innerHTML=html;

timerBox=document.getElementById("timerBox");

let minutes = Math.floor(timeLeft/60);

let seconds = timeLeft%60;

timerBox.innerHTML =
"⏱ "
+String(minutes).padStart(2,"0")
+":"
+String(seconds).padStart(2,"0");
  
load();
centerCurrentPalette();
  
}



function centerCurrentPalette(){
 const p=document.getElementById("palette");
 if(!p)return;
 const btn=p.querySelectorAll("button")[q];
 if(btn) btn.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}

function load(){

visited[q]=true;

const palette = document.querySelectorAll("#palette button");

palette.forEach((btn, index) => {

    let color = "#e5e7eb";

    if(index === q){
        color = "#2563eb";
    }
    else if(review[index]){
        color="#a855f7";
    }
    else if(answers[index] != null){
        if(isBiharPattern && answers[index]==4){
            color="#9ca3af";
        }else{
            color="#16a34a";
        }
    }
    else if(visited[index]){
        color = "#facc15";
    }

    btn.style.background = color;

});
centerCurrentPalette();
  
if(!timer){

startTimer();

}
  
qno.innerHTML = "Q " + (q+1) + " / " + quiz.length;

question.innerHTML = quiz[q].question;
  
let totalOptions = isBiharPattern ? 5 : 4;
  
for(let i=0;i<totalOptions;i++){
  
let b=document.getElementById("b"+i);

b.className="option";

if(i==4){

b.innerHTML="Not Attempted";

}
else{

b.innerHTML=quiz[q].options[i];

}
  
if(answers[q]==i)
b.classList.add("selected");

}

}

function formatQuestion(text){

    if(!text) return "";

    text = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");

    if(text.indexOf("\n") !== -1){
        return text.replace(/\n/g,"<br>");
    }

    text = text.replace(/:\s*1\.\s*/g,":<br><br>1. ");
    text = text.replace(/ (\d{1,2})\.\s/g,function(m,n){
        return "<br><br>"+n+". ";
    });

    text = text.replace(/\s*(Which of the (above|following)[^?]*\?)/gi,"<br><br>$1");
    text = text.replace(/\s*(How many of the (above|following)[^?]*\?)/gi,"<br><br>$1");

    return text;
}

function answer(i){

answers[q]=i;

localStorage.setItem(
"answers",
JSON.stringify(answers)
);


let totalOptions = isBiharPattern ? 5 : 4;

for(let j=0;j<totalOptions;j++){
  
document.getElementById("b"+j)
.classList.remove("selected");

}

document.getElementById("b"+i)
.classList.add("selected");

showQuiz();
  
}

function next(){

if(q<quiz.length-1){

q++;

localStorage.setItem(
"currentQuestion",
q
);

showQuiz();
  
}

}

function goToQuestion(i){

q=i;

localStorage.setItem(
"currentQuestion",
q
);

showQuiz();
  
}


function prev(){

if(q>0){

q--;

localStorage.setItem(
"currentQuestion",
q
);

showQuiz();
  
}

}

function palettePrev(){

    if(q>0){

        q--;

        localStorage.setItem("currentQuestion",q);

        showQuiz();

    }

}

function paletteNext(){

    if(q<quiz.length-1){

        q++;

        localStorage.setItem("currentQuestion",q);

        showQuiz();

    }

}

function toggleReview(){
    review[q]=!review[q];
    showQuiz();
}

function confirmSubmit(){

    let attempted = 0;
    let notAttempted = 0;
    let reviewCount = 0;

    for(let i=0;i<answers.length;i++){

        if(review[i]) reviewCount++;

        if(answers[i]==null){

            notAttempted++;

        }
        else if(isBiharPattern && answers[i]==4){

            notAttempted++;

        }
        else{

            attempted++;

        }

    }

    document.getElementById("submitStats").innerHTML=`
        <p>✅ <b>Attempted :</b> ${attempted}</p>
        <p>⭕ <b>Not Attempted :</b> ${notAttempted}</p>
        <p>📌 <b>Marked for Review :</b> ${reviewCount}</p>
        <p>📚 <b>Total Questions :</b> ${quiz.length}</p>
    `;

    document.getElementById("submitModal").classList.add("show");

}

function closeSubmitModal(){

    document.getElementById("submitModal").classList.remove("show");

}

function finalSubmit(){

    closeSubmitModal();

    submitTest();

}
  
async function submitTest(){

clearInterval(timer);

localStorage.removeItem("inTest");
localStorage.removeItem("answers");
localStorage.removeItem("currentQuestion");

document.querySelector(".submitBtn").disabled=true;

document.querySelector(".submitBtn").innerHTML=
"Submitting...";

document.querySelector(".submitBtn").style.opacity="0.5";

document.querySelector(".submitBtn").style.cursor="not-allowed";

let correct=0;
let wrong=0;
let notAttempted = 0;

for(let i=0;i<quiz.length;i++){

    // Bihar Pattern
    if(isBiharPattern){

        if(answers[i] == 4){

            notAttempted++;

        }
        else if(answers[i] == quiz[i].correct){

            correct++;

        }
        else{

            // A/B/C/D wrong OR nothing selected
            wrong++;

        }

    }

    // Other Exams
    else{

        if(answers[i] != null){

            if(answers[i] == quiz[i].correct){

                correct++;

            }
            else{

                wrong++;

            }

        }

    }

}
let pos =
examConfig[exam].positive;

let neg =
examConfig[exam].negative;

let raw=correct*pos;

let final=(correct*pos)-(wrong*neg);

final=final.toFixed(2);

console.time("Result Page");

console.log("=== DEBUG ===");
console.log("Correct:", correct);
console.log("Wrong:", wrong);
console.log("Not Attempted:", notAttempted);
console.log("Raw:", raw);
console.log("Final:", final);
console.log("Calling showResult with 5 parameters");

console.log("----- BEFORE showResult -----");
console.log({
  correct,
  wrong,
  notAttempted,
  raw,
  final,
  pos,
  neg
});
  
showResult(correct,wrong,notAttempted,raw,final);
  
console.timeEnd("Result Page");

fetch(rAPI,{

method:"POST",

mode:"no-cors",

body:JSON.stringify({

data:{
name:userName,
score:final,
total:quiz.length,
exam:exam,
subject:subject,
topic:topic,
time:new Date().toLocaleString()
}

})

});

localStorage.setItem(
"testsAttempted",
parseInt(localStorage.getItem("testsAttempted")||0)+1
);

localStorage.setItem(
"questionsSolved",
parseInt(localStorage.getItem("questionsSolved")||0)+quiz.length
);
  
}


async function 
  
showResult(c,w,na,raw,final){

console.log("----- INSIDE showResult -----");
console.log({
  c,
  w,
  na,
  raw,
  final
});

let res=await fetch(rAPI+"?sheet=results");
  
let data=await res.json();

console.time("showResult");

let html = `
<div style="
text-align:center;
margin-bottom:30px;
">

<div style="
display:inline-block;
padding:8px 18px;
background:#eff6ff;
color:#1e3a8a;
border-radius:999px;
font-weight:600;
font-size:16px;
margin-bottom:15px;
">
${exam}
</div>

<h3 style="

">

">
📊 Performance Report

Well done, ${userName}! 🎉
</p>

</div>
`;
  
html += `
<div class="resultBox">

<div class="summaryGrid">

<div class="summaryCard">
<div class="summaryLabel">🎯 Final Score</div>
<div class="summaryValue">${final}</div>
</div>

<div class="summaryCard">
<div class="summaryLabel">✅ Correct Answers</div>
<div class="summaryValue" style="color:#16a34a">${c}</div>
</div>

<div class="summaryCard">
<div class="summaryLabel">❌ Incorrect Answers</div>
<div class="summaryValue" style="color:#dc2626">${w}</div>
</div>

${
isBiharPattern
?
`
<div class="summaryCard">
<div class="summaryLabel">⭕ Not Attempted</div>
<div class="summaryValue" style="color:#f59e0b">${na}</div>
</div>
`
:
`
<div class="summaryCard">

<div class="summaryValue">${quiz.length}</div>
</div>
`
}

</div>

<hr style="margin:30px 0;border:none;border-top:1px solid #e5e7eb;">

<h3 style="color:#1e3a8a;margin-bottom:15px;">
📈 Performance Insights
</h3>
`;

let deduction = (raw-final).toFixed(2);

html+="Raw Score: "+raw+"<br>";
html+="Negative Marks: -"+deduction+"<br>";

let attempted = c+w;

let accuracy = 0;

let attemptRate = 0;

if(attempted>0){

accuracy = ((c/attempted)*100).toFixed(1);

attemptRate =
((attempted/quiz.length)*100).toFixed(1);

}

html+="<br>Accuracy: "+accuracy+"%";
html+="<br>Attempt Rate: "+attemptRate+"%";
html+="<br>Attempted: "+attempted+" / "+quiz.length;
html+="<br>Skipped: "+(quiz.length-attempted);

html+=`
</div>
`;

let mentor="";

if(accuracy>=80 && attemptRate>=80){

mentor=
"🌟 Excellent work! Your accuracy and attempt rate are both impressive. Keep maintaining consistency and challenge yourself with tougher tests.";

}

else if(accuracy>=80 && attemptRate<60){

mentor=
"📈 Your accuracy is excellent, but you are under-attempting. Trust yourself more and gradually increase your attempts.";

}

else if(accuracy>=60 && attemptRate>=80){

mentor=
"💪 Good effort! You are attempting enough questions. Focus on reducing mistakes and your score will improve significantly.";

}

else if(accuracy<50 && attemptRate>85){

mentor=
"🎯 You are showing courage by attempting many questions. Now focus on improving accuracy. Learn from mistakes and avoid random guessing.";

}

else{

mentor=
"🌱 Every topper starts somewhere. Don't worry about today's score. Stay consistent, revise regularly, and improvement will surely come.";

}

html+=`
<div class="resultBox"
style="
margin-top:30px;
padding:25px;
text-align:left;
">

<h2 style="color:#1e3a8a;">
🤖 Mentor Recommendation
</h2>

<p style="
font-size:20px;
line-height:1.8;
">
${mentor}
</p>

</div>
`;

html+="</div>";

html+="<h3>🏆 Leaderboard</h3>";

let board=[];

for(let i=0;i<data.length;i++){

if(

data[i].exam==exam &&
data[i].subject==subject &&
data[i].topic==topic

){

board.push(data[i]);

}

}

let bestScores={};

for(let i=0;i<board.length;i++){

let name=board[i].name;

if(
!bestScores[name] ||
Number(board[i].score)>
Number(bestScores[name].score)
){

bestScores[name]=board[i];

}

}

board=Object.values(bestScores);

board.sort((a,b)=>Number(b.score)-Number(a.score));

console.log(board);

for(let i=0;i<board.length;i++){

html+=(i+1)+". "+board[i].name+
" - "+board[i].score+"<br>";

}

html+="<hr><h2>📚 Detailed Question Review</h2>";

for(let i=0;i<quiz.length;i++){

let color="#f1f1f1";

if(answers[i]==quiz[i].correct){

color="#d4edda";

}
else if(answers[i]!=null){

color="#f8d7da";

}

html+="<div class='resultBox' style='background:"+color+"'>";
  
html+="<b>Q"+(i+1)+". "
+quiz[i].question+"</b><br><br>";

html+="Your Answer : ";

if(answers[i]==null){

html+="Not Attempted";

}else{

html+=quiz[i].options[answers[i]];

}

html+="<br><br>";
if(answers[i]==quiz[i].correct){

html+="<span style='color:green'><b>✓ Correct</b></span>";

}
else if(answers[i]==null){

html+="<span style='color:gray'><b>Not Attempted</b></span>";

}
else{

html+="<span style='color:red'><b>✗ Wrong</b></span>";

}

html+="<br><br>";
  
html+="Correct Answer : "
+quiz[i].options[quiz[i].correct]
+"<br><br>";

html+="Explanation :<br>";

if(quiz[i].explanation){

html+=quiz[i].explanation;

}
else{

html+="Explanation will be added soon.";

}

html+="</div><br>";

}

html += `
<br><br>

<button class="subjectBtn"
onclick="selectSubject(subject)">
📝 More Tests from ${subject}
</button>

<button class="subjectBtn"
onclick="selectExam(exam)">
📚 Change Subject
</button>

<button class="subjectBtn"
onclick="showExams()">
🏠 All Exams
</button>

`;
  
app.innerHTML=html;

console.timeEnd("showResult");

}
