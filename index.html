<!DOCTYPE html>
<html>

<head>

<title>Test KaroAB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{

margin:0;

font-family:'Laila', serif;

background:#eef2f7;

}

.container{

max-width:950px;

margin:30px auto;

background:white;

padding:60px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

h2{

text-align:center;

color:#1e3a8a;

font-size:56px;

font-weight:700;

margin-bottom:15px;

line-height:1.2;

}

.subtitle{

text-align:center;

font-size:22px;

font-weight:500;

color:#6b7280;

margin-top:-5px;

margin-bottom:40px;

}
  
.timer{
color:red;
font-weight:bold;
text-align:right;
}

.option{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#f1f5f9;
}

.selected{
background:#2563eb;
color:white;
}

.subjectBtn{

width:100%;

padding:18px;

margin:10px 0;

background:#2563eb;

color:white;

border:none;

border-radius:15px;

font-size:22px;

font-weight:600;

cursor:pointer;

transition:0.3s;

box-shadow:0 4px 15px rgba(37,99,235,.25);

}

.subjectBtn:hover{

background:#1d4ed8;

transform:translateY(-2px);

box-shadow:0 8px 20px rgba(37,99,235,.35);

}

.nav button{
padding:10px;
margin:5px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
}

.resultBox{
padding:10px;
background:#f8fafc;
margin-top:10px;
}

.correct{color:green}
.wrong{color:red}
.final{color:purple;font-weight:bold}

</style>

</head>

<body>

<div style="
background:white;
text-align:center;
padding:10px;
border-bottom:2px solid #1e3a8a;
">

<img src="logo.png" style="width:200px;max-width:90%;">

</div>

<div id="app" class="container">
Loading...

</div>

<script>

let q=0;
let quiz=[];
let answers=[];
let dataAll=[];
let userName="";
let exam="";
let subject="";
let topic="";
let timer;
let timeLeft=60;

const qAPI =
"https://sheetdb.io/api/v1/yqs4b4igymmwc";

const rAPI =
"https://sheetdb.io/api/v1/qejobk1s0ferj?sheet=results";

function start(){

app.innerHTML=`

<h1>Welcome to Test KaroAB</h1>

<p class="subtitle">
Practice Smart • Compete Better • Learn Faster
</p>

<input

id="nameInput"

placeholder="Enter Your Name to Start Practicing"

style="
width:100%;
padding:20px;
margin:25px 0;
border:1px solid #d1d5db;
border-radius:15px;
font-size:22px;
outline:none;
box-sizing:border-box;
"
>

<button
class="subjectBtn"
onclick="continueQuiz()">

Start Practicing

</button>

`;

}
async function continueQuiz(){

userName =
document.getElementById("nameInput").value;

if(userName==""){

alert("Please enter your name");

return;

}

let res = await fetch(qAPI);

dataAll = await res.json();

showExams();

}
  
function showExams(){

let exams=[];

for(let i=0;i<dataAll.length;i++){

let e=dataAll[i].Exam;

if(!exams.includes(e))
exams.push(e);

}

let html="<h2>Select Exam</h2>";

for(let i=0;i<exams.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectExam('"+exams[i]+"')\">"+
exams[i]+
"</button>";

}

app.innerHTML=html;

}


function selectExam(e){

exam=e;

let subs=[];

for(let i=0;i<dataAll.length;i++){

if(dataAll[i].Exam==exam){

let s=dataAll[i].Subject;

if(!subs.includes(s))
subs.push(s);

}

}

let html="<h2>Select Subject</h2>";

for(let i=0;i<subs.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectSubject('"+subs[i]+"')\">"+
subs[i]+
"</button>";

}

app.innerHTML=html;

}


function selectSubject(s){

subject=s;

let topics=[];

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject
){

let t=dataAll[i].Topic;

if(!topics.includes(t))
topics.push(t);

}

}

let html="<h2>Select Topic</h2>";

for(let i=0;i<topics.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectTopic('"+topics[i]+"')\">"+
topics[i]+
"</button>";

}

app.innerHTML=html;

}


function selectTopic(t){

topic=t;

quiz=[];
answers=[];
q=0;

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject &&
dataAll[i].Topic==topic
){

quiz.push({

question:dataAll[i].question,

options:[
dataAll[i].op1,
dataAll[i].op2,
dataAll[i].op3,
dataAll[i].op4
],

correct:parseInt(dataAll[i].correct),

explanation:dataAll[i].Explanation

});


answers.push(null);

}

}

timeLeft = 30;

showQuiz();

startTimer();

}


function startTimer(){

clearInterval(timer);

timeLeft = 30;

timer = setInterval(()=>{

timeLeft--;

timerBox.innerHTML = "Time: " + timeLeft;

if(timeLeft <= 0){

clearInterval(timer);

if(q < quiz.length-1){

q++;
load();

}else{

submitTest();

}

}

},1000);

}


function showQuiz(){

let html="";

html+="<h2>"+exam+" - "+subject+" - "+topic+"</h2>";

html+="<div>User: "+userName+"</div>";

html+="<div id='timerBox' class='timer'></div>";

html+="<h3 id='qno'></h3>";

html+="<p id='question'></p>";

html+="<button class='option' id='b0' onclick='answer(0)'></button>";
html+="<button class='option' id='b1' onclick='answer(1)'></button>";
html+="<button class='option' id='b2' onclick='answer(2)'></button>";
html+="<button class='option' id='b3' onclick='answer(3)'></button>";

html+="<div class='nav'>";
html+="<button onclick='prev()'>Prev</button>";
html+="<button onclick='next()'>Next</button>";
html+="<button onclick='submitTest()'>Submit</button>";
html+="</div>";

app.innerHTML=html;

timerBox=document.getElementById("timerBox");

load();

}


function load(){

clearInterval(timer);
startTimer();
  
qno.innerHTML=
"Q "+(q+1)+" / "+quiz.length;

question.innerHTML=
quiz[q].question;

for(let i=0;i<4;i++){

let b=document.getElementById("b"+i);

b.className="option";

b.innerHTML=quiz[q].options[i];

if(answers[q]==i)
b.classList.add("selected");

}

}


function answer(i){

answers[q]=i;
load();

}


function next(){

if(q<quiz.length-1){
q++;
load();
}

}


function prev(){

if(q>0){
q--;
load();
}

}


async function submitTest(){

clearInterval(timer);

let correct=0;
let wrong=0;

for(let i=0;i<quiz.length;i++){

if(answers[i]!=null){

if(answers[i]==quiz[i].correct)
correct++;
else
wrong++;

}

}

let pos=1;
let neg=0;

if(exam=="UPSC"){pos=2;neg=0.66;}
else if(exam=="SSC/Railway"){pos=2;neg=0.5;}
else if(exam=="PCS"){pos=2;neg=0.66;}
else if(exam=="Law"){pos=1;neg=0;}

let raw=correct*pos;

let final=(correct*pos)-(wrong*neg);

final=final.toFixed(2);

await fetch(rAPI,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

data:{
name:userName,
score:final,
total:quiz.length,
exam:exam,
subject:subject,
topic:topic,
time:new Date().toLocaleString()
}

})

});

showResult(correct,wrong,raw,final);

}


async function showResult(c,w,raw,final){

let res=await fetch(rAPI);

let data=await res.json();

let html="<h2>Result</h2>";

html+="<div class='resultBox'>";

html+="Correct: <span class='correct'>"+c+"</span><br>";
html+="Wrong: <span class='wrong'>"+w+"</span><br>";
html+="Raw: "+raw+"<br>";
html+="Final: <span class='final'>"+final+"</span>";

html+="</div>";

html+="<h3>🏆 Leaderboard</h3>";

let board=[];

for(let i=0;i<data.length;i++){

if(
data[i].exam==exam &&
data[i].subject==subject &&
data[i].topic==topic
){

board.push(data[i]);

}

}

board.sort((a,b)=>Number(b.score)-Number(a.score));

for(let i=0;i<board.length;i++){

html+=(i+1)+". "+board[i].name+
" - "+board[i].score+"<br>";

}

board.sort((a,b)=>Number(b.score)-Number(a.score));

for(let i=0;i<board.length;i++){

html+=(i+1)+". "+board[i].name+
" - "+board[i].score+"<br>";

}

html+="<hr><h2>📚 Detailed Question Review</h2>";

for(let i=0;i<quiz.length;i++){

let color="#f1f1f1";

if(answers[i]==quiz[i].correct){

color="#d4edda";

}
else if(answers[i]!=null){

color="#f8d7da";

}

html+="<div class='resultBox' style='background:"+color+"'>";
  
html+="<b>Q"+(i+1)+". "
+quiz[i].question+"</b><br><br>";

html+="Your Answer : ";

if(answers[i]==null){

html+="Not Attempted";

}else{

html+=quiz[i].options[answers[i]];

}

html+="<br><br>";
if(answers[i]==quiz[i].correct){

html+="<span style='color:green'><b>✓ Correct</b></span>";

}
else if(answers[i]==null){

html+="<span style='color:gray'><b>Not Attempted</b></span>";

}
else{

html+="<span style='color:red'><b>✗ Wrong</b></span>";

}

html+="<br><br>";
  
html+="Correct Answer : "
+quiz[i].options[quiz[i].correct]
+"<br><br>";

html+="Explanation :<br>";

if(quiz[i].explanation){

html+=quiz[i].explanation;

}
else{

html+="Explanation will be added soon.";

}

html+="</div><br>";

}

app.innerHTML=html;

}

start();

</script>

</body>

</html>
