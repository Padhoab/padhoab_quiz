<!DOCTYPE html>
<html>

<head>

<title>Test KaroAB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600;700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{

margin:0;

font-family:'Laila', serif;

background:#eef2f7;

}

.container{

max-width:950px;

margin:30px auto;

background:white;

padding:60px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

h2{

text-align:center;

color:#1e3a8a;

font-size:56px;

font-weight:700;

margin-bottom:15px;

line-height:1.2;

}

.subtitle{

text-align:center;

font-size:22px;

font-weight:500;

color:#6b7280;

margin-top:-5px;

margin-bottom:40px;

}
  
.timer{
color:red;
font-weight:bold;
text-align:right;
}

.option{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:8px;
background:#f1f5f9;
cursor:pointer;
}

.selected{
background:#2563eb;
color:white;
}

.subjectBtn{

width:100%;

padding:18px;

margin:10px 0;

background:#2563eb;

color:white;

border:none;

border-radius:15px;

font-size:22px;

font-weight:600;

cursor:pointer;

transition:0.3s;

box-shadow:0 4px 15px rgba(37,99,235,.25);

}

.subjectBtn:hover{

background:#1d4ed8;

transform:translateY(-2px);

box-shadow:0 8px 20px rgba(37,99,235,.35);

}

.nav button{
padding:10px;
margin:5px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.submitBtn{

background:#16a34a !important;

transition:0.15s;

}

.submitBtn:hover{

background:#15803d !important;

}

.submitBtn:active{

transform:scale(0.92);

background:#166534 !important;

}

.nav button{

transition:0.15s;

}

.nav button:active{

transform:scale(0.95);

}

.resultBox{
padding:10px;
background:#f8fafc;
margin-top:10px;
}

.correct{color:green}
.wrong{color:red}
.final{color:purple;font-weight:bold}

header{

background:#07112b;

padding:15px 8%;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:2px solid #1e3a8a;

}

.logo img{

width:120px;

height:auto;

}

nav{

display:flex;

gap:30px;

}

nav a{

color:white;

text-decoration:none;

font-size:18px;

font-weight:600;

}

nav a:hover{

color:#60a5fa;

}

footer{

background:#07112b;

color:white;

text-align:center;

padding:40px 20px;

margin-top:50px;

}

.footer-links{

margin-bottom:20px;

}

.footer-links a{

color:white;

text-decoration:none;

margin:0 15px;

font-size:18px;

font-weight:500;

}

.footer-links a:hover{

color:#60a5fa;

}

@media (max-width:768px){

header{
flex-direction:column;
padding:15px;
}

.logo img{
width:80px;
}

nav{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:15px;
}

nav a{
font-size:16px;
}

h1{
font-size:60px;
}

.container{
width:95%;
padding:20px;
box-sizing:border-box;
}

}
  
</style>

</head>

<body>

<header>

<div class="logo">

<a href="https://padhoab.in">

<img src="logo.png">

</a>

</div>

<nav>

<a href="https://padhoab.in">Home</a>

<a href="https://padhoab.in/current-affairs.html">Current Affairs</a>

<a href="https://padhoab.in/static-gk.html">Static GK</a>

<a href="https://padhoab.in/contact.html">Contact</a>

</nav>

</header>

<div id="app" class="container">

Loading...

</div>

<script>

let q=0;
let quiz=[];
let answers=[];
let dataAll=[];
let userName="";
let exam="";
let subject="";
let topic="";
let timer;

let questionTime = 30;

let timeLeft = questionTime;
  
const qAPI =
"https://script.google.com/macros/s/AKfycby2Hh9iPQC2mx44e4HBQQ6kemwUBcAi5O7UD1czaWJ0lxV5zUIA5RQr2KhjZql0451pMw/exec";

const rAPI =
"https://script.google.com/macros/s/AKfycby2Hh9iPQC2mx44e4HBQQ6kemwUBcAi5O7UD1czaWJ0lxV5zUIA5RQr2KhjZql0451pMw/exec";
  
function menu(){

return `
<div style="
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
">

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="showExams()">
🏠 All Exams
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="selectExam(exam)">
📚 Subject
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px"
onclick="showProgress()">
📊 My Progress
</button>

<button class="subjectBtn"
style="flex:1;padding:12px;font-size:18px;background:#dc2626"
onclick="logout()">
🚪 Logout
</button>

</div>
`;

}

function start(){

userName = localStorage.getItem("testkaroab_name") || "";

if(userName!=""){

fetch(qAPI)
.then(res=>res.json())
.then(data=>{
dataAll=data;
showExams();
});

return;

}

app.innerHTML=`

<h2>Welcome to Test KaroAB</h2>

<p class="subtitle">
Practice Smart • Compete Better • Learn Faster
</p>

<input

id="nameInput"

value="${userName}"

placeholder="Enter Your Name to Start Practicing"

style="
width:100%;
padding:20px;
margin:25px 0;
border:1px solid #d1d5db;
border-radius:15px;
font-size:22px;
outline:none;
box-sizing:border-box;
"
>

<button
class="subjectBtn"
onclick="continueQuiz()">

Start Practicing

</button>

`;

}
async function continueQuiz(){

userName =
document.getElementById("nameInput").value;

localStorage.setItem("testkaroab_name", userName);

if(userName==""){

alert("Please enter your name");

return;

}

let res = await fetch(qAPI);

dataAll = await res.json();

showExams();

}
  
function showExams(){

let html = menu();

html += `
<h2>Welcome, ${userName}</h2>

<p class="subtitle">
Select an Exam to Continue Your Preparation
</p>

`;

let exams=[];

for(let i=0;i<dataAll.length;i++){

let e=dataAll[i].Exam;

if(!exams.includes(e))
exams.push(e);

}

for(let i=0;i<exams.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectExam('"+exams[i]+"')\">"+
exams[i]+
"</button>";

}

app.innerHTML=html;

}


function selectExam(e){

exam=e;

let subs=[];

for(let i=0;i<dataAll.length;i++){

if(dataAll[i].Exam==exam){

let s=dataAll[i].Subject;

if(!subs.includes(s))
subs.push(s);

}

}

let html=`
<h2>${exam}</h2>

<p class="subtitle">
Choose a Subject
</p>
`;

for(let i=0;i<subs.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectSubject('"+subs[i]+"')\">"+
subs[i]+
"</button>";

}

app.innerHTML=html;

}


function selectSubject(s){

subject=s;

let topics=[];

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject
){

let t=dataAll[i].Topic;

if(!topics.includes(t))
topics.push(t);

}

}

let html=`
<h2>${subject}</h2>

<p class="subtitle">
Choose a Topic
</p>
`;
  
for(let i=0;i<topics.length;i++){

html+=
"<button class='subjectBtn' onclick=\"selectTopic('"+topics[i]+"')\">"+
topics[i]+
"</button>";

}

app.innerHTML=html;

}


function selectTopic(t){

topic=t;

quiz=[];
answers=[];
q=0;

for(let i=0;i<dataAll.length;i++){

if(
dataAll[i].Exam==exam &&
dataAll[i].Subject==subject &&
dataAll[i].Topic==topic
){

quiz.push({

question:dataAll[i].question,

options:[
dataAll[i].op1,
dataAll[i].op2,
dataAll[i].op3,
dataAll[i].op4
],

correct:parseInt(dataAll[i].correct),

explanation:dataAll[i].Explanation

});


answers.push(null);

}

}

timeLeft = questionTime;

showQuiz();

startTimer();

}

function startTimer(){

if(timer) return;

timer = setInterval(()=>{

timeLeft--;

timerBox.innerHTML = "Time: " + timeLeft;

if(timeLeft <= 0){

clearInterval(timer);

timer = null;

if(q < quiz.length-1){

q++;

timeLeft = questionTime;

load();

}

else{

submitTest();

}

}

},1000);

}

function showQuiz(){

let html="";

html+="<h2>"+exam+" - "+subject+" - "+topic+"</h2>";

html+="<div>User: "+userName+"</div>";

html+="<div id='timerBox' class='timer'></div>";

html+="<h3 id='qno'></h3>";

html+="<p id='question'></p>";

html+="<button class='option' id='b0' onclick='answer(0)'></button>";
html+="<button class='option' id='b1' onclick='answer(1)'></button>";
html+="<button class='option' id='b2' onclick='answer(2)'></button>";
html+="<button class='option' id='b3' onclick='answer(3)'></button>";

html+="<div class='nav'>";
html+="<button onclick='prev()'>Prev</button>";
html+="<button onclick='next()'>Next</button>";
html+="<button class='submitBtn' onclick='submitTest()'>Submit</button>";
html+="</div>";

app.innerHTML=html;

timerBox=document.getElementById("timerBox");

load();

}


function load(){

if(!timer){

startTimer();

}
  
qno.innerHTML=
"Q "+(q+1)+" / "+quiz.length;

question.innerHTML=
quiz[q].question;

for(let i=0;i<4;i++){

let b=document.getElementById("b"+i);

b.className="option";

b.innerHTML=quiz[q].options[i];

if(answers[q]==i)
b.classList.add("selected");

}

}


function answer(i){

answers[q]=i;

for(let j=0;j<4;j++){

document.getElementById("b"+j)
.classList.remove("selected");

}

document.getElementById("b"+i)
.classList.add("selected");

}


function next(){

if(q<quiz.length-1){
q++;
load();
}

}


function prev(){

if(q>0){
q--;
load();
}

}


async function submitTest(){

clearInterval(timer);

let correct=0;
let wrong=0;

for(let i=0;i<quiz.length;i++){

if(answers[i]!=null){

if(answers[i]==quiz[i].correct)
correct++;
else
wrong++;

}

}

let pos=1;
let neg=0;

if(exam=="UPSC"){pos=2;neg=0.66;}
else if(exam=="SSC/Railway"){pos=2;neg=0.5;}
else if(exam=="PCS"){pos=2;neg=0.66;}
else if(exam=="Law"){pos=1;neg=0;}

let raw=correct*pos;

let final=(correct*pos)-(wrong*neg);

final=final.toFixed(2);

await fetch(rAPI,{

method:"POST",

mode:"no-cors",

body:JSON.stringify({

data:{
name:userName,
score:final,
total:quiz.length,
exam:exam,
subject:subject,
topic:topic,
time:new Date().toLocaleString()
}

})

});
  
showResult(correct,wrong,raw,final);

}


async function showResult(c,w,raw,final){

let res=await fetch(rAPI+"?sheet=results");
  
let data=await res.json();

let html="<h2>Result</h2>";

html += `
<p class="subtitle">
Well done, ${userName}! 🎉
</p>
`;

html+="<div class='resultBox'>";

html+="Correct: <span class='correct'>"+c+"</span><br>";
html+="Wrong: <span class='wrong'>"+w+"</span><br>";
html+="Raw: "+raw+"<br>";
html+="Final: <span class='final'>"+final+"</span>";

html+="</div>";

html+="<h3>🏆 Leaderboard</h3>";

let board=[];

for(let i=0;i<data.length;i++){

if(

data[i].exam==exam &&
data[i].subject==subject &&
data[i].topic==topic

){

board.push(data[i]);

}

}

let bestScores={};

for(let i=0;i<board.length;i++){

let name=board[i].name;

if(
!bestScores[name] ||
Number(board[i].score)>
Number(bestScores[name].score)
){

bestScores[name]=board[i];

}

}

board=Object.values(bestScores);

board.sort((a,b)=>Number(b.score)-Number(a.score));

console.log(board);

for(let i=0;i<board.length;i++){

html+=(i+1)+". "+board[i].name+
" - "+board[i].score+"<br>";

}

html+="<hr><h2>📚 Detailed Question Review</h2>";

for(let i=0;i<quiz.length;i++){

let color="#f1f1f1";

if(answers[i]==quiz[i].correct){

color="#d4edda";

}
else if(answers[i]!=null){

color="#f8d7da";

}

html+="<div class='resultBox' style='background:"+color+"'>";
  
html+="<b>Q"+(i+1)+". "
+quiz[i].question+"</b><br><br>";

html+="Your Answer : ";

if(answers[i]==null){

html+="Not Attempted";

}else{

html+=quiz[i].options[answers[i]];

}

html+="<br><br>";
if(answers[i]==quiz[i].correct){

html+="<span style='color:green'><b>✓ Correct</b></span>";

}
else if(answers[i]==null){

html+="<span style='color:gray'><b>Not Attempted</b></span>";

}
else{

html+="<span style='color:red'><b>✗ Wrong</b></span>";

}

html+="<br><br>";
  
html+="Correct Answer : "
+quiz[i].options[quiz[i].correct]
+"<br><br>";

html+="Explanation :<br>";

if(quiz[i].explanation){

html+=quiz[i].explanation;

}
else{

html+="Explanation will be added soon.";

}

html+="</div><br>";

}

html += `
<br><br>

<button class="subjectBtn"
onclick="selectSubject(subject)">
📝 More Tests from ${subject}
</button>

<button class="subjectBtn"
onclick="selectExam(exam)">
📚 Change Subject
</button>

<button class="subjectBtn"
onclick="showExams()">
🏠 All Exams
</button>

`;
  
app.innerHTML=html;

}

function logout(){

localStorage.removeItem("testkaroab_name");

location.reload();

}

async function showProgress(){

let res = await fetch(rAPI);

let data = await res.json();

console.log(data);
console.log(userName);

let tests = 0;
let questions = 0;
let totalAccuracy = 0;

for(let i=0;i<data.length;i++){

if(data[i].name == userName){

if(data[i].accuracy){

totalAccuracy += Number(data[i].accuracy);

}

tests++;

questions += Number(data[i].total);

}

}

let avgAccuracy = 0;

if(tests > 0){

avgAccuracy = (totalAccuracy/tests).toFixed(1);

}
  
app.innerHTML = menu() + `

<h2>📊 My Progress</h2>

<p class="subtitle">
Track Your Preparation Journey
</p>

<div style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:20px;
margin-top:30px;
">

<div class="resultBox"
style="
padding:20px;
min-height:170px;
display:flex;
flex-direction:column;
justify-content:space-between;
">

<h3>📝 Tests Attempted</h3>
<h1 style="
font-size:70px;
text-align:center;
color:#1e3a8a;
">
${tests}
</h1>
</div>

<div class="resultBox"
style="
padding:20px;
min-height:170px;
display:flex;
flex-direction:column;
justify-content:space-between;
">
<h3>📚 Questions Solved</h3>
<h1 style="
font-size:70px;
text-align:center;
color:#1e3a8a;
margin:0;
">
${questions}
</h1>
</div>

<div class="resultBox"
style="
padding:20px;
min-height:170px;
display:flex;
flex-direction:column;
justify-content:space-between;
">
<h3>🎯 Average Accuracy</h3>
<h1 style="
font-size:70px;
text-align:center;
color:#1e3a8a;
">
${avgAccuracy}%
</h1>
</div>

<div class="resultBox"
style="
padding:20px;
min-height:170px;
display:flex;
flex-direction:column;
justify-content:space-between;
">
<h3>🏆 Achievements</h3>
<h2>Coming Soon</h2>
</div>

</div>

`;

}
  
start();

</script>

</body>

</html>
